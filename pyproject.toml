[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-novelist"
version = "0.1.0"
description = "A minimal LangGraph and Codex CLI based assistant for drafting novels."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
web = [
  "fastapi>=0.136",
  "uvicorn[standard]>=0.47",
]

[project.scripts]
ai-novelist = "ai_novelist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_novelist.prompts" = ["*.md", "partials/*.md"]
